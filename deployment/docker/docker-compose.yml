version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - GOOGLE_CLOUD_PROJECT=blockbuster-agentic-studio
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USERNAME=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DATABASE=default
      - CLICKHOUSE_SECURE=false
      - MCP_COMMAND=uv
      - MCP_ARGS=["run", "--with", "mcp-clickhouse", "--python", "3.13", "mcp-clickhouse"]
    depends_on:
      - clickhouse
    networks:
      - agentic-network

  orchestration:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.orchestration
    environment:
      - NODE_ENV=development
      - GOOGLE_CLOUD_PROJECT=blockbuster-agentic-studio
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USERNAME=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DATABASE=default
      - CLICKHOUSE_SECURE=false
      - MCP_COMMAND=uv
      - MCP_ARGS=["run", "--with", "mcp-clickhouse", "--python", "3.13", "mcp-clickhouse"]
    depends_on:
      - clickhouse
    networks:
      - agentic-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=media_catalog
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql
    networks:
      - agentic-network

networks:
  agentic-network:
    driver: bridge

volumes:
  clickhouse-data:
