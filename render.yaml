services:
  - type: web
    name: catalog-greenlight
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      # --- Gemini: prefer Vertex (GCP billing credits) over AI Studio prepaid ---
      - key: GOOGLE_GENAI_USE_VERTEXAI
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_LOCATION
        value: us-central1
      # Full service-account JSON (Render secret). Do not commit. Needs roles/aiplatform.user.
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      # Optional local/dev fallback when Vertex vars are unset:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: CLICKHOUSE_HOST
        sync: false
      - key: CLICKHOUSE_PORT
        value: "8443"
      - key: CLICKHOUSE_USER
        value: default
      - key: CLICKHOUSE_PASSWORD
        sync: false
      - key: CLICKHOUSE_DATABASE
        value: media_catalog
      - key: CLICKHOUSE_SECURE
        value: "true"
      - key: CLICKHOUSE_ALLOW_WRITE_ACCESS
        value: "true"
      - key: NODE_ENV
        value: production
